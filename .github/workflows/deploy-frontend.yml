name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Permisos mínimos que necesita el deploy a Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya está corriendo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        env:
          # La app se sirve bajo https://<usuario>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # URL del backend. Se define como variable del repo (Settings → Variables).
          # Mientras no exista, queda vacía y la app no podrá llamar a la API.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Fallback SPA para BrowserRouter
        # Pages sirve 404.html cuando la ruta no existe como archivo. Al copiar
        # index.html encima, cualquier ruta profunda (/recipes, /market...) carga
        # la app y react-router resuelve del lado del cliente.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
